# WagersPlugin configuration

# Seconds both players are frozen before the fight starts
countdown-seconds: 5

# Seconds before an unanswered wager request expires
request-expire-seconds: 60

# Wager amount limits
min-wager: 1.0
max-wager: 1000000.0

# Abbreviate money everywhere: $5,000,000 shows as $5M, $1,500 as $1.5K
# (K = thousand, M = million, B = billion, T = trillion, Q = quadrillion)
# Set to false for full numbers.
abbreviate-money: true

# Announce fights + results to the whole server
broadcast-fights: true

rtp:
  # World ALL random-teleport fights happen in. This is strict - fights never
  # use the challenger's current world. If this world doesn't exist, the wager
  # is cancelled and both players are refunded.
  world: "world"
  # Random teleport radius (blocks) around the world spawn.
  # Keep this within terrain that's already generated! The plugin will never
  # generate new chunks (that lags the server), so if the area isn't
  # pregenerated it falls back to spots near spawn/players.
  radius: 500
  # How far apart the two players spawn from each other
  player-gap: 8

# ---------------- Rotating Events ----------------
events:
  enabled: true
  # Seconds between events (countdown shown in placeholders)
  interval-seconds: 900
  # How long the join window stays open after the announcement
  join-seconds: 60
  # Minimum players needed or the event is cancelled (fees refunded)
  min-players: 2
  # Max fight length; if time runs out it's a draw (fees refunded)
  max-fight-seconds: 300
  # Boss bar countdown at the top of the screen
  bossbar: true
  # How many seconds before an event the boss bar appears
  bossbar-lead-seconds: 60
  # Events cycle through this list in order, then loop back to the top.
  # mode: CLASSIC, DIAMOND, NODEBUFF, SUMO, HARDCORE
  rotation:
    - name: "&b&lSkywars"
      mode: CLASSIC
      game: SKYWARS
      prize: 10000
      entry-fee: 0
    - name: "&e&lSumo"
      mode: CLASSIC
      game: SUMO
      prize: 5000
      entry-fee: 0
    - name: "&c&lBed Wars"
      mode: CLASSIC
      game: BEDWARS
      prize: 15000
      entry-fee: 100
    - name: "&a&lParkour"
      mode: CLASSIC
      game: PARKOUR
      prize: 7500
      entry-fee: 0

# ---------------- Escape prevention ----------------
# Controls ender pearls, chorus fruit, elytra, and /tp-style teleports.
#   countdown - blocked only during the frozen pre-fight countdown, then allowed
#               once "FIGHT!" appears (default - lets players pearl in combat)
#   always    - blocked for the entire fight
#   never     - never blocked
# The plugin's own teleports (arena spawns, post-fight returns) always work.
block-escape-items: countdown

# Let players watch live fights with /wager spectate <player>
allow-spectating: true

# ---------------- Side betting ----------------
betting:
  enabled: true
  min-bet: 1
  max-bet: 1000000
  # Fraction of the losing pool the server keeps (0 = players get everything)
  house-cut: 0.0

# ---------------- Arenas ----------------
# type: RTP      -> random spot in the wild (default)
# type: PLATFORM -> a disc the plugin builds; falling off = instant loss
arenas:
  # Build missing platforms automatically on first use
  auto-build: true
  # Blocks placed per tick while building (lower = slower but gentler on TPS)
  blocks-per-tick: 150

  # Sumo now runs as an event minigame (see the minigames section below),
  # so wager fights in SUMO mode use RTP unless you add a PLATFORM arena here.

  HARDCORE:
    type: PLATFORM
    world: world_the_end
    x: 400
    y: 60
    z: 400
    radius: 14
    material: OBSIDIAN
    void-death: true

  # These use RTP unless you change them to PLATFORM:
  # CLASSIC:
  #   type: RTP
  # DIAMOND:
  #   type: RTP
  # NODEBUFF:
  #   type: RTP

# ---------------- Perimeter ----------------
# How far (blocks, horizontal) a fighter may stray from the centre of an RTP
# fight before being stopped. Platform arenas use their own radius + 8.
fight-boundary-radius: 60

# How far a spectator may drift from the fighter they're watching before being
# pulled back. Keep this small - spectator mode sees through blocks, so a large
# value lets people scout bases while "watching" a fight.
spectator-leash-radius: 25

# Give each fighter a real vanilla world border around the match. The client
# itself blocks them from walking out (red wall visible), which is far more
# reliable than cancelling movement. Radius = fight-boundary-radius, or the
# platform arena's radius + 8.
match-border: true

# ---------------- Minigames ----------------
# Maps build themselves the first time they run - no schematics, no setup.
# Pick coordinates in EMPTY space (high up over ocean is safest).
# ANYTHING ALREADY AT THESE COORDINATES WILL BE OVERWRITTEN.
minigames:
  auto-build: true
  blocks-per-tick: 150

  SKYWARS:
    world: "world"
    x: 1000
    y: 120
    z: 1000
    radius: 26
    island-count: 8        # also the player cap
    island-radius: 4
    island-material: GRASS_BLOCK
    chest-items: 5         # random items per chest
    loot:
      - "STONE_SWORD:1"
      - "IRON_SWORD:1"
      - "LEATHER_CHESTPLATE:1"
      - "IRON_HELMET:1"
      - "GOLDEN_APPLE:2"
      - "COOKED_BEEF:8"
      - "OAK_PLANKS:32"
      - "BOW:1"
      - "ARROW:8"
      - "ENDER_PEARL:1"
      - "IRON_PICKAXE:1"

  SUMO:
    world: "world"
    x: 1200
    y: 120
    z: 1200
    radius: 8
    material: OBSIDIAN

  BEDWARS:
    world: "world"
    x: 1400
    y: 120
    z: 1400
    radius: 26
    island-count: 8        # also the player cap
    island-radius: 5
    island-material: SANDSTONE
    bed-material: RED_BED
    generator-material: IRON_BLOCK
    generator-seconds: 10
    items:
      - "WHITE_WOOL:16"
      - "IRON_INGOT:3"
      - "GOLDEN_APPLE:1"

  PARKOUR:
    world: "world"
    x: 1600
    y: 120
    z: 1600
    radius: 60             # must be big - the course wanders
    jumps: 20
    material: QUARTZ_BLOCK
    finish-material: GOLD_BLOCK
